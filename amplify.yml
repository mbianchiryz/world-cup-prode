version: 1
applications:
  - appRoot: client
    frontend:
      phases:
        preBuild:
          commands:
            # Use npm install (not ci) — more forgiving with platform-specific
            # optional deps that esbuild/vitest bring in for non-Linux platforms.
            - npm install --no-audit --no-fund
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
      redirects:
        - source: '</^[^.]+$|\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map|json)$)([^.]+$)/>'
          target: /index.html
          status: '200'
